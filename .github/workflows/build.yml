name: InstaX Verification (no APK)

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [ develop ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

concurrency:
  group: instax-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and unit tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # These tasks compile the app variants and run JVM tests without packaging APK/AAB files.
      # The production APK is intentionally reserved for the final release stage.
      - name: Compile app variants
        run: |
          ./gradlew :app:compileGplayDebugKotlin :app:compileFdroidDebugKotlin :app:compileGplayReleaseKotlin -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      - name: Run app unit tests
        run: ./gradlew :app:testGplayDebugUnitTest -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      - name: Verify release manifest snapshot
        run: ./tools/manifest/aaptDump.sh --help
